name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/ci.lock.txt
      - run: uv lock --check
      - run: python -m pip install --no-deps -e .
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy src
      - run: python -m compileall -q src
      - run: python -m pip check
      - run: pip-audit
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -m wechat_article_reader --help
      - run: python -m wechat_article_reader.mcp --help
      - run: wechat-article-reader check

  test:
    name: test (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/ci.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: pytest -q
