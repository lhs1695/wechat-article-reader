{% extends "base.html" %}
{% block content %}

<div class="page-header">
  <h1>微信文章阅读</h1>
  <p>贴链接，导出统一 Markdown 投影（默认无图）。摘要可选。</p>
</div>

<div class="card">
  <div class="card-title">本机缓存</div>
  <div class="stats">
    <div class="stat"><div class="stat-value" id="n-c">-</div><div class="stat-label">缓存文章</div></div>
  </div>
  <p class="home-next"><a href="/article">去单篇贴链接</a></p>
</div>

<script nonce="{{ request.state.csp_nonce }}">
fetch('/api/status').then(r=>r.json()).then(d=>{
  document.getElementById('n-c').textContent=d.total_cached;
}).catch(()=>{
  document.getElementById('n-c').textContent='—';
});
</script>
{% endblock %}
