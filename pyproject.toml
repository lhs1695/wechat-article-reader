[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-article-reader"
version = "3.1.0"
description = "微信公众号文章阅读、缓存与摘要服务"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [
    {name = "lhs1695"}
]
keywords = ["wechat", "article", "reader", "summarizer", "deepseek", "markdown", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # 核心
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "nh3>=0.2.21,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.13,<3",
    "loguru>=0.7.0",
    # 持久化与迁移
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    # CLI
    "click>=8.1.0",
    "rich>=13.0.0",
    # 导出
    "markdownify>=0.11.0",
    # 路径管理
    "platformdirs>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/lhs1695/wechat-article-reader"
Issues = "https://github.com/lhs1695/wechat-article-reader/issues"

[project.optional-dependencies]
# AI摘要器
ai = [
    "openai>=1.0.0",
]
# Web 界面
web = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.31.1,<1",
    "jinja2>=3.1.6,<4",
    "markdown-it-py>=3.0.0,<5",
]
# MCP (Model Context Protocol) 服务支持
mcp = [
    "mcp>=1.28,<2",
    "starlette>=1.3.1,<1.4",
    "uvicorn>=0.31.1,<1",
    "markdown-it-py>=3.0.0,<5",
]
# 全部功能
full = [
    "openai>=1.0.0",
    "fastapi>=0.141.1,<0.142",
    "jinja2>=3.1.6,<4",
    "markdown-it-py>=3.0.0,<5",
    "mcp>=1.28,<2",
    "starlette>=1.3.1,<1.4",
    "uvicorn>=0.31.1,<1",
]
# 构建和打包
build = [
    "pyinstaller>=6.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
# 开发
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-benchmark>=4.0.0",
    "pytest-randomly>=3.15.0",
    "respx>=0.20.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "pip-audit>=2.7.0",
]

[dependency-groups]
ci = ["build==1.5.0", "uv==0.11.15"]

[project.scripts]
wechat-article-reader = "wechat_article_reader.presentation.cli:run_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wechat_article_reader = [
    "presentation/web/static/*",
    "presentation/web/templates/*",
    "infrastructure/persistence/migrations/*.py",
    "infrastructure/persistence/migrations/*.mako",
    "infrastructure/persistence/migrations/versions/*.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012", "SIM108"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = []  # Disabled due to pydantic-core version incompatibility

[[tool.mypy.overrides]]
module = [
    "wechat_article_reader.domain.*",
    "wechat_article_reader.application.*",
]
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/wechat_article_reader"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/infrastructure/adapters/summarizers/deepseek.py",
    "*/shared/progress.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true
fail_under = 60
