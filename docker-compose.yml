services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - WECHAT_ARTICLE_READER_DEEPSEEK__MODEL=${WECHAT_ARTICLE_READER_DEEPSEEK__MODEL:-deepseek-v4-flash}
      - WECHAT_ARTICLE_READER_EXPORT__DEFAULT_OUTPUT_DIR=/app/output
    volumes:
      - app-runtime:/app/.runtime
      - ./output:/app/output
    restart: unless-stopped

volumes:
  app-runtime:
